<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Define the gradient for a modern feel, matching the brand blue -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ca4e0" />
      <stop offset="100%" stop-color="#188bc8" />
    </linearGradient>
    <!-- Define a lighter blue for the thin accent lines -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#73c2ed" />
      <stop offset="100%" stop-color="#49abdf" />
    </linearGradient>
  </defs>

  <!-- BACKGROUND: Invisible by default for seamless transparency -->
  
  <!-- SYMBOL CONTAINER -->
  <g id="hb-symbol">
    <!-- Leftmost main vertical stem of the "H" -->
    <rect x="40" y="40" width="7" height="120" rx="1.5" fill="url(#brandGrad)" />
    
    <!-- Left thin vertical accent tick crossing the horizontal bar -->
    <line x1="60" y1="70" x2="60" y2="110" stroke="url(#accentGrad)" stroke-width="2" stroke-linecap="round" />
    
    <!-- Central horizontal connector bar that spans across -->
    <rect x="40" y="96" width="120" height="7" rx="1.5" fill="url(#brandGrad)" />

    <!-- Split vertical column segments in the middle (between H & B) -->
    <!-- Upper vertical segment -->
    <rect x="90" y="40" width="6" height="30" rx="1.5" fill="url(#brandGrad)" />
    <!-- Lower vertical segment -->
    <rect x="90" y="130" width="6" height="30" rx="1.5" fill="url(#brandGrad)" />

    <!-- Split vertical main stem for the "B" loops -->
    <!-- Upper vertical segment -->
    <rect x="102" y="40" width="6" height="38" rx="1.5" fill="url(#brandGrad)" />
    <!-- Lower vertical segment -->
    <rect x="102" y="122" width="6" height="38" rx="1.5" fill="url(#brandGrad)" />

    <!-- Right thin vertical accent tick crossing inside the B loops -->
    <line x1="116" y1="65" x2="116" y2="135" stroke="url(#accentGrad)" stroke-width="2" stroke-linecap="round" />

    <!-- The top loop curve of the "B" -->
    <path d="M105,43 C128,43 145,52 145,69 C145,86 128,96 105,96" 
          fill="none" stroke="url(#brandGrad)" stroke-width="6" stroke-linecap="round" />
          
    <!-- The bottom loop curve of the "B" -->
    <path d="M105,96 C130,96 148,106 148,126 C148,146 130,157 105,157" 
          fill="none" stroke="url(#brandGrad)" stroke-width="6" stroke-linecap="round" />
  </g>
</svg>
